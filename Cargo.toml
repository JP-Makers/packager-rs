[package]
name = "package-builder"
version = "1.0.0"
edition = "2024"

[dependencies]
# alpm
alpm-compress = "0.1.5"
alpm-mtree = "0.4.0"
alpm-package = "0.4.4"
alpm-buildinfo = "0.6.0"
alpm-pkginfo = "0.7.0"
alpm-types = "0.14.0"

# compression
bzip2 = "0.6.1"
flate2 = "1.1.11"
tar = "0.4.46"
liblzma = "0.4.9"
zstd = "0.14.4"
ar = "0.9.0"

# checksum
blake2 = "0.11.0"
sha2 = "0.11.1"
hex = "0.4.3"
md-5 = "0.11.0"
sha1 = "0.11.0"

# network
reqwest = { version = "0.13.5", features = ["stream"] }
tokio = { version = "1.54.1", features = ["full"] }
futures-util = "0.3.34"
walkdir = "2.5.0"
backhand = "0.25.5"

rpm = "0.30.2"
time = { version = "0.3.55", features = ["macros"] }
dirs = "7.0.0"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9"
xml = "1.4.0"
msi = "0.11.1"
uuid = { version = "1.29.2", features = ["v4", "v5"] }
pgp = "0.21.1"
ed25519 = "3.0.0"
toml = "1.2.1"

# Secure randomness for key generation on platforms without /dev/urandom.
[target.'cfg(not(unix))'.dependencies]
getrandom = "0.4.3"

[profile.release]
opt-level = "z" # Optimize for size ("s" also good)
lto = true      # Link Time Optimization
