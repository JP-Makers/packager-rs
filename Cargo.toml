[package]
name = "packager-rs"
version = "1.0.0"
edition = "2024"
description = "Open-source multi-format packaging engine and library"
license = "MIT"

[lib]
name = "packager_rs"
path = "src/lib.rs"

[[bin]]
name = "package-builder"
path = "src/main.rs"

[dependencies]
# compression
bzip2 = "0.6.1"
flate2 = "1.1.11"
tar = "0.4.46"
liblzma = "0.4.9"
zstd = "0.14.4"
ar = "0.9.0"
zip = { version = "9.7.0", default-features = false, features = [
    "deflate-flate2",
] }

# checksum
sha2 = "0.11.1"
hex = "0.4.3"
md-5 = "0.11.0"
sha1 = "0.11.0"

# network
reqwest = { version = "0.13.5", features = ["stream"] }
tokio = { version = "1.54.1", features = ["full"] }
futures-util = "0.3.34"
walkdir = "2.5.0"
backhand = "0.25.5"

rpm = "0.30.2"
dirs = "7.0.0"
clap = { version = "4.6.8", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yml = "0.0.13"
xml = "1.4.0"
msi = "0.11.1"
uuid = { version = "1.29.3", features = ["v4", "v5"] }
pgp = "0.21.1"
ed25519 = "3.0.0"
getrandom = "0.4.3"
toml = "1.2.1"

[profile.release]
opt-level = "z"   # Optimize for size ("s" also good)
lto = true        # Link Time Optimization
codegen-units = 1 # Maximum size optimization
panic = "abort"   # Remove unwinding tables
strip = true      # Strip debug symbols

[lints.clippy]
panic = "warn"
